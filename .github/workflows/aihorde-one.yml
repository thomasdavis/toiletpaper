name: Temporary AI Horde One-Conversation Test

on:
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  generate-one:
    if: github.head_ref == 'tmp/aihorde-one-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate one dialogue through AI Horde anonymous inference
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = "https://aihorde.net/api/v2"
          headers = {
              "Content-Type": "application/json",
              "apikey": "0000000000",
              "Client-Agent": "ajaxdavis-training-data:0.1:https://github.com/thomasdavis/toiletpaper",
          }
          prompt = r'''You are generating synthetic historical-dialogue training data.
Create exactly one six-turn counterfactual conversation between Socrates and Confucius about whether virtue is taught, practised, or discovered through examination.

Return exactly six non-empty lines and nothing else. Alternate speakers exactly. Use this exact syntax:
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message

Each message must be one or two historically grounded sentences. Develop a real disagreement and partial synthesis. Do not claim they actually met. Do not use authentic quotations, markdown, headings, commentary, or stage directions.
End after the sixth line with the marker <END>.
'''
          payload = {
              "prompt": prompt,
              "params": {
                  "n": 1,
                  "max_context_length": 4096,
                  "max_length": 700,
                  "temperature": 0.45,
                  "top_p": 0.9,
                  "top_k": 40,
                  "min_p": 0.05,
                  "typical": 1.0,
                  "tfs": 1.0,
                  "rep_pen": 1.08,
                  "rep_pen_range": 1024,
                  "stop_sequence": ["<END>"],
                  "singleline": False,
                  "frmttriminc": True
              },
              "models": ["google/gemma-4-31b"],
              "trusted_workers": False,
              "validated_backends": True,
              "slow_workers": True,
              "extra_slow_workers": True,
              "worker_blacklist": False,
              "allow_downgrade": False,
              "dry_run": False
          }

          req = urllib.request.Request(
              base + "/generate/text/async",
              data=json.dumps(payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  submitted = json.loads(response.read())
                  print("SUBMIT_STATUS", response.status)
                  print("SUBMIT_RESPONSE", json.dumps(submitted, indent=2))
          except urllib.error.HTTPError as exc:
              print("SUBMIT_ERROR", exc.code, exc.read().decode(errors="replace"))
              raise

          job_id = submitted["id"]
          deadline = time.time() + 720
          while time.time() < deadline:
              time.sleep(5)
              with urllib.request.urlopen(base + f"/generate/text/status/{job_id}", timeout=60) as response:
                  status = json.loads(response.read())
              print("POLL", json.dumps({
                  "done": status.get("done"),
                  "faulted": status.get("faulted"),
                  "is_possible": status.get("is_possible"),
                  "queue_position": status.get("queue_position"),
                  "wait_time": status.get("wait_time"),
                  "generations": len(status.get("generations") or [])
              }))
              if status.get("done") or status.get("faulted") or not status.get("is_possible", True):
                  print("FINAL_RESPONSE", json.dumps(status, ensure_ascii=False, indent=2))
                  generations = status.get("generations") or []
                  if not generations:
                      raise SystemExit("No generation returned")
                  text = generations[0].get("text", "")
                  print("=== GENERATED TEXT ===")
                  print(text)
                  tagged = [line for line in text.strip().splitlines() if line.startswith("|entity.")]
                  if len(tagged) != 6:
                      raise SystemExit(f"Expected 6 tagged lines, got {len(tagged)}")
                  raise SystemExit(0)
          raise SystemExit("Timed out waiting for AI Horde")
          PY
