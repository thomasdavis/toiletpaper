name: Temporary AI Horde Public Inference Probe 2

on:
  pull_request:
    types: [opened]
    paths:
      - .github/workflows/aihorde-probe2.yml

permissions: {}

jobs:
  probe:
    if: github.head_ref == 'tmp/aihorde-probe2-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Submit and retrieve one anonymous AI Horde text generation
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = 'https://aihorde.net/api/v2'
          headers = {
              'Content-Type': 'application/json',
              'apikey': '0000000000',
              'Client-Agent': 'ajaxdavis-training-data:0.1:https://github.com/thomasdavis/toiletpaper',
          }
          prompt = '''Create exactly one six-turn counterfactual dialogue between Socrates and Confucius about whether virtue is taught, practised, or discovered through examination.
Return exactly six lines and nothing else, alternating these exact tags:
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message
|entity.socrates.virtue_and_learning| message
|entity.confucius.virtue_and_learning| message
Each message must be one or two historically grounded sentences. Develop disagreement and partial synthesis. Do not claim they met or use authentic quotations. End after line six with <END>.'''
          payload = {
              'prompt': prompt,
              'params': {
                  'n': 1,
                  'max_context_length': 4096,
                  'max_length': 700,
                  'temperature': 0.45,
                  'top_p': 0.9,
                  'top_k': 40,
                  'min_p': 0.05,
                  'typical': 1.0,
                  'tfs': 1.0,
                  'rep_pen': 1.08,
                  'rep_pen_range': 1024,
                  'stop_sequence': ['<END>'],
                  'singleline': False,
                  'frmttriminc': True,
              },
              'models': ['google/gemma-4-31b'],
              'trusted_workers': False,
              'validated_backends': True,
              'slow_workers': True,
              'extra_slow_workers': True,
              'worker_blacklist': False,
              'allow_downgrade': False,
              'dry_run': False,
          }
          request = urllib.request.Request(
              base + '/generate/text/async',
              data=json.dumps(payload).encode('utf-8'),
              headers=headers,
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  submitted = json.loads(response.read())
                  print('SUBMIT_STATUS', response.status)
                  print('SUBMIT_RESPONSE', json.dumps(submitted, ensure_ascii=False))
          except urllib.error.HTTPError as exc:
              print('SUBMIT_ERROR', exc.code, exc.read().decode(errors='replace'))
              raise

          job_id = submitted['id']
          deadline = time.time() + 660
          while time.time() < deadline:
              time.sleep(5)
              with urllib.request.urlopen(base + f'/generate/text/status/{job_id}', timeout=60) as response:
                  status = json.loads(response.read())
              print('POLL', json.dumps({
                  'done': status.get('done'),
                  'faulted': status.get('faulted'),
                  'is_possible': status.get('is_possible'),
                  'queue_position': status.get('queue_position'),
                  'wait_time': status.get('wait_time'),
                  'generations': len(status.get('generations') or []),
              }))
              if status.get('done') or status.get('faulted') or not status.get('is_possible', True):
                  print('FINAL_RESPONSE', json.dumps(status, ensure_ascii=False))
                  generations = status.get('generations') or []
                  if not generations:
                      raise SystemExit('No generation returned')
                  text = generations[0].get('text', '')
                  print('GENERATED_TEXT_BEGIN')
                  print(text)
                  print('GENERATED_TEXT_END')
                  tagged = [line for line in text.splitlines() if line.startswith('|entity.')]
                  print('VALID_TAGGED_LINES', len(tagged))
                  if len(tagged) != 6:
                      raise SystemExit(f'Expected 6 tagged lines, got {len(tagged)}')
                  raise SystemExit(0)
          raise SystemExit('Timed out waiting for AI Horde')
          PY
